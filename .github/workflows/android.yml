name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Android ${{ matrix.target }} ${{ matrix.arch }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lib
            arch: arm64
          - target: exe
            arch: arm64
          - target: exe
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang \
            lld \
            cmake \
            unzip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          cmake --version
          ninja --version
          clang --version
          echo "NDK: $ANDROID_NDK_HOME"

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build
        run: |
          ./build.sh \
            --platform android \
            --target "${{ matrix.target }}" \
            --build release \
            --arch "${{ matrix.arch }}"

      - name: Show build output
        if: always()
        run: |
          echo "===== Files ====="
          find . -maxdepth 5 -type f \
            \( -name "*.so" -o -name "MobileDumper7" -o -name "*.a" \) \
            -print || true

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p artifacts

          find . -type f \
            \( -name "*.so" -o -name "MobileDumper7" \) \
            -not -path "./.git/*" \
            -exec cp --parents {} artifacts/ \; || true

          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "No build artifacts found."
            exit 1
          fi

          tar -czf \
            "MobileDumper7-android-${{ matrix.target }}-${{ matrix.arch }}.tar.gz" \
            -C artifacts .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileDumper7-android-${{ matrix.target }}-${{ matrix.arch }}
          path: MobileDumper7-android-${{ matrix.target }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
